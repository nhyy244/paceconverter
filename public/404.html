<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1749C8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2F5BD6" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231749C8'/%3E%3C/svg%3E" />
    <title>Not found — Pace Converter</title>
    <!--
      Deliberately self-contained: the hashed stylesheet's name changes every
      build, and a strict Content-Security-Policy blocks inline styles from a
      host's own fallback page. A handful of system-font rules is the one thing
      certain to render.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f5f4f1;
        --ink: #101010;
        --minor: #73736e;
        --blue: #1749c8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0c0d0f;
          --ink: #f0f0ed;
          --minor: #8f8f89;
          --blue: #7fa0f0;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 10px;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--minor);
        font-size: 0.9rem;
      }
      a {
        color: var(--blue);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>No such page</h1>
    <p>There's only one page here, and it's the ruler.</p>
    <p><a href="/">Go to the pace converter</a></p>
  </body>
</html>
