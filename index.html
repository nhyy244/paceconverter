<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1749C8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2F5BD6" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Running pace ruler — min/km and min/mi side by side, with finish times for every race from a 5K to a 300-mile ultra." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231749C8'/%3E%3C/svg%3E" />
    <link rel="canonical" href="https://paceconverter.run/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pace Converter" />
    <meta property="og:url" content="https://paceconverter.run/" />
    <meta property="og:title" content="Pace Converter" />
    <meta property="og:description" content="Every row is one pace: min/km, min/mi, and finish times from a 5K to a 300-mile ultra." />
    <meta property="og:image" content="https://paceconverter.run/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A ruler of running paces: min/km and min/mi beside finish times for each race distance." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Pace Converter — pace, splits and race times</title>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <h1>Pace Converter</h1>
        <p>Every row is one pace. Read across for miles, and for what that pace means at every distance from a 5K to a 300&#8209;mile ultra.</p>
      </header>
      <div class="plate-wrap">
        <main class="plate" id="plate">
          <span class="pin" aria-hidden="true"></span>
          <span class="pin pin-right" aria-hidden="true"></span>
          <div class="views">
            <div
              id="tape"
              class="tape"
              role="table"
              tabindex="0"
              aria-label="Pace ruler from 1:30 to 20:00 minutes per kilometer, with finish times for each race distance. Drag it in any direction, or use the arrow keys."
            >
              <header class="head" id="head" role="row"></header>
            </div>
            <div id="calc" class="calc"></div>
          </div>
          <noscript>
            <p class="fallback">
              The ruler is built in the browser, so it needs JavaScript enabled.
            </p>
          </noscript>
        </main>
        <!--
          Outside the plate, which clips its own overflow so the tape's corners
          stay rounded — and would clip a button straddling its edge. Hidden
          until the script that gives it a second view to swap to has run.

          The glyph is two 170° arcs of a radius-7 circle centred on (12, 12),
          each with a chevron head, rotationally symmetric about that centre:
          two arrows chasing each other round.
        -->
        <button
          id="swap"
          class="swap"
          type="button"
          hidden
          aria-controls="tape calc"
          aria-label="Change to calculator"
          data-tip="Change to calculator"
        >
          <span class="swap-disc">
            <svg class="swap-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <g
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5.03 12.61A7 7 0 0 1 18.76 10.19" />
                <path d="M16.16 8.01 18.76 10.19 19.92 6.99" />
                <path d="M18.97 11.39A7 7 0 0 1 5.24 13.81" />
                <path d="M7.84 15.99 5.24 13.81 4.08 17.01" />
              </g>
            </svg>
          </span>
        </button>
      </div>
      <footer class="footnote">
        <p>
          Ultra distances follow each organizer's
          own published figure — those courses are rerouted between editions.
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
