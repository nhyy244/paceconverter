<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1749C8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2F5BD6" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Running pace ruler — min/km and min/mi side by side, with finish times for every race from a 5K to a 300-mile ultra." />
    <!--
      A runner mid-stride on the bib's blue, drawn from round-capped strokes so
      the limbs stay solid down to 16 px. Inline rather than a file so the tab
      icon costs no request; single-quoted attributes keep the escaping to
      <, > and #. Two speed lines, not three — at 16 px a third merges into a
      smudge. Checked at 16, 32 and 104 px, on light and dark tab strips.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6.5' fill='%231749c8'/%3E%3Cg fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round'%3E%3Cg stroke-width='4.2'%3E%3Cpath d='M18.4 12.8L15.2 18.8'/%3E%3Cpath d='M15.2 18.8L11.4 21.6L7.4 25.2'/%3E%3Cpath d='M15.2 18.8L19.8 21.8L21.8 26.6'/%3E%3C/g%3E%3Cg stroke-width='3.55'%3E%3Cpath d='M18.4 12.8L15 16L11.6 17.4'/%3E%3Cpath d='M18.4 12.8L22.2 15.4L24.8 13'/%3E%3C/g%3E%3Cg stroke-width='3.1'%3E%3Cpath d='M2.4 12.6L7 12.6'/%3E%3Cpath d='M1.8 17.4L6.2 17.4'/%3E%3C/g%3E%3C/g%3E%3Ccircle cx='20.6' cy='7.4' r='3.05' fill='%23fff'/%3E%3C/svg%3E" />
    <!-- iOS ignores an SVG icon when a page is saved to the home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://paceconverter.run/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pace Converter" />
    <meta property="og:url" content="https://paceconverter.run/" />
    <meta property="og:title" content="Pace Converter" />
    <meta property="og:description" content="Every row is one pace: min/km, min/mi, and finish times from a 5K to a 300-mile ultra." />
    <meta property="og:image" content="https://paceconverter.run/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A ruler of running paces: min/km and min/mi beside finish times for each race distance." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Pace Converter — pace, splits and race times</title>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <h1>Pace Converter</h1>
        <p>Every row is one pace. Read across for miles, and for what that pace means at every distance from a 5K to a 300&#8209;mile ultra.</p>
      </header>
      <div class="plate-wrap">
        <main class="plate" id="plate">
          <span class="pin" aria-hidden="true"></span>
          <span class="pin pin-right" aria-hidden="true"></span>
          <div class="views">
            <div
              id="tape"
              class="tape"
              role="table"
              tabindex="0"
              aria-label="Pace ruler from 1:30 to 20:00 minutes per kilometer, with finish times for each race distance. Drag it in any direction, or use the arrow keys."
            >
              <header class="head" id="head" role="row"></header>
            </div>
            <div id="calc" class="calc"></div>
          </div>
          <noscript>
            <p class="fallback">
              The ruler is built in the browser, so it needs JavaScript enabled.
            </p>
          </noscript>
        </main>
        <!--
          Outside the plate, which clips its own overflow so the tape's corners
          stay rounded — and would clip a button straddling its edge. Hidden
          until the script that gives it a second view to swap to has run.

          The glyph is two arrows chasing each other round: 130° arcs of a
          radius-7 circle centred on (12, 12), rotationally symmetric about that
          centre, each finished with a solid head aligned to the tangent. The
          heads are filled triangles rather than stroked chevrons because at
          38 px a chevron's inner barb falls inside the circle and the whole
          thing closes up into a blob.
        -->
        <button
          id="swap"
          class="swap"
          type="button"
          hidden
          aria-controls="tape calc"
          aria-label="Change to calculator"
          data-tip="Change to calculator"
        >
          <span class="swap-disc">
            <svg class="swap-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M5.03 12.61A7 7 0 0 1 14.42 5.43" />
                <path d="M18.97 11.39A7 7 0 0 1 9.58 18.57" />
              </g>
              <g fill="currentColor">
                <path d="M18.8 8.22 14.47 8.48 17.56 4.05Z" />
                <path d="M5.2 15.78 9.53 15.52 6.44 19.95Z" />
              </g>
            </svg>
          </span>
        </button>
      </div>
      <footer class="footnote">
        <p>
          Ultra distances follow each organizer's
          own published figure — those courses are rerouted between editions.
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
