<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1749C8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2F5BD6" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Running pace ruler — min/km and min/mi side by side, with finish times for every race from a 5K to a 300-mile ultra." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231749C8'/%3E%3C/svg%3E" />
    <title>Pace Converter — pace, splits and race times</title>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <h1 color = #1749c8>Pace Converter</h1>
        <p>Every row is one pace. Read across for miles, and for what that pace means at every distance from a 5K to a 300&#8209;mile ultra.</p>
      </header>
      <main class="plate" id="plate">
        <span class="pin" aria-hidden="true"></span>
        <span class="pin pin-right" aria-hidden="true"></span>
        <div
          id="tape"
          class="tape"
          role="table"
          tabindex="0"
          aria-label="Pace ruler from 1:30 to 100:00 minutes per kilometer, with finish times for each race distance. Drag it in any direction, or use the arrow keys."
        >
          <header class="head" id="head" role="row"></header>
        </div>
      </main>
      <footer class="footnote">
        <p>
          Ultra distances follow each organizer's
          own published figure — those courses are rerouted between editions.
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
