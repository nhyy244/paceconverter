# Cache-Control by path, so the headers below can live at server level. An
# add_header inside a location block would otherwise discard every inherited
# header, taking the security headers with it.
map $uri $cache_control {
  default     "public, max-age=0, must-revalidate";
  ~^/assets/  "public, max-age=31536000, immutable";
}

server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml font/woff2;

  add_header Cache-Control $cache_control always;

  # Kept in step with vercel.json, so self-hosting and Vercel behave alike.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

  location / {
    try_files $uri $uri/ =404;
  }
}
